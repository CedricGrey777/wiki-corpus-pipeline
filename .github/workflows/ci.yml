name: CI

on:
  push:
    branches: ['**']
    paths: ['corpus_pipeline/**', 'tests/**', 'dags/**', 'pyproject.toml', 'Dockerfile', '.dockerignore', 'compose.yaml', '.github/workflows/**']
  pull_request:
    paths: ['corpus_pipeline/**', 'tests/**', 'dags/**', 'pyproject.toml', 'Dockerfile', '.dockerignore', 'compose.yaml', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build the project image
        run: docker compose build cli
      - name: Check installed dependencies
        run: docker compose run --rm --no-deps --entrypoint python cli -m pip check
      - name: Run contract tests
        run: docker compose run --rm --no-deps --entrypoint python cli -m pytest -q tests/test_contracts.py
      - name: Run the complete synthetic test suite
        run: docker compose run --rm --no-deps --entrypoint python cli -m pytest -q
      - name: Run the CLI demo and inspect its READY release
        run: |
          docker compose run --rm --no-deps --entrypoint bash cli -euc '
            python -m corpus_pipeline --root /tmp/corpus-ci run-demo --release-id synthetic-ci-v2
            python -m corpus_pipeline --root /tmp/corpus-ci inspect --release-id synthetic-ci-v2
          '
